<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- Sin zoom del navegador: el pellizco es el zoom del juego. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="./assets/img/icon.jpg" />
    <title>The Chaos Machine</title>
    <link rel="stylesheet" href="./src/ui/styles.css" />
    <!-- npm run build swaps in the production engine -->
    <script type="importmap">
      { "imports": { "@weed.js/engine": "https://cdn.jsdelivr.net/npm/@weed.js/engine@^0.14.0/dist/weed.prod.bundle.esm.min.js" } }
    </script>
  </head>
  <body>
    <!-- La UI es HTML plano encima del canvas: src/ui/ la maneja. -->
    <div id="ui-root"></div>

    <script type="module">
      import WEED from 'https://cdn.jsdelivr.net/npm/@weed.js/engine@^0.14.0/dist/weed.prod.bundle.esm.min.js';

      const DEV = true; // npm run build sets this to false
      // El juego se importa después del engine: sus módulos usan el global WEED que este import define.
      const { boot } = await import('./src/main.js');
      await boot(WEED, { dev: DEV });
    </script>
  </body>
</html>
